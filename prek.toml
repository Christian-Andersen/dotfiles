# Secrets + hygiene checks. Enable as git hooks with `prek install`;
# run manually with `prek run -a`. The gitleaks hook is built with the
# `go` toolchain (present in the nix tool env: see nix/tools.nix).
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{id = "gitleaks"}]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
]
