# Secrets, hygiene, and repo-wide lint/format checks. Install as git hooks
# with `prek install`; run manually with `prek run -a` (or just the root
# workspace with the boilerplate projects skipped: see .github/workflows).
# The gitleaks hook is built with the `go` toolchain (present in the lint
# dev shell: see nix/flake.nix).
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", exclude = '^images/' },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-symlinks" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-illegal-windows-names" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "nix-statix"
name = "statix"
language = "system"
files = '\.nix$'
pass_filenames = false
entry = "statix fix"
require_serial = true

[[repos.hooks]]
id = "nix-deadnix"
name = "deadnix"
language = "system"
files = '\.nix$'
entry = "deadnix --edit"
require_serial = true

[[repos.hooks]]
id = "nix-alejandra"
name = "alejandra"
language = "system"
files = '\.nix$'
entry = "alejandra"
require_serial = true

[[repos.hooks]]
id = "shfmt"
name = "shfmt"
language = "system"
files = '\.sh$'
entry = "shfmt -w"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
files = '\.sh$'
entry = "shellcheck"

[[repos.hooks]]
id = "fish-indent"
name = "fish_indent"
language = "system"
files = '\.fish$'
entry = "fish_indent -w"

[[repos.hooks]]
id = "fish-syntax"
name = "fish --no-execute"
language = "system"
files = '\.fish$'
entry = "fish --no-execute"

[[repos.hooks]]
id = "stylua"
name = "stylua"
language = "system"
files = '\.lua$'
entry = "stylua"

[[repos.hooks]]
id = "taplo-format"
name = "taplo format"
language = "system"
files = '\.toml$'
exclude = '^boilerplate/'
entry = "taplo format"

[[repos.hooks]]
id = "yamlfmt"
name = "yamlfmt"
language = "system"
files = '\.ya?ml$'
exclude = '^boilerplate/'
entry = "yamlfmt"

[[repos.hooks]]
id = "markdownlint"
name = "markdownlint --fix"
language = "system"
files = '\.md$'
entry = "markdownlint --fix"

[[repos.hooks]]
id = "just-format"
name = "just --fmt --check"
language = "system"
files = '^justfile$'
pass_filenames = false
entry = "just --fmt --check"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
files = '^home/dot-local/bin/check_repos$'
entry = "ruff check --fix"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
files = '^home/dot-local/bin/check_repos$'
entry = "ruff format"
