name: build-image
on:
  push:
    branches:
      - main
  workflow_dispatch:
# GITHUB_TOKEN needs packages:write to push to GHCR.
# If the package lands as private, flip it to public once under
# https://github.com/users/<you>/packages (Package settings).
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run CI checks
        # The boilerplate projects have their own toolchains/dependencies;
        # `just check` only runs the root dotfiles workspace. Fixing hooks
        # exit 0 after rewriting files, so `just ci` also diffs afterwards.
        run: nix develop ./nix#lint --command just ci
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image with Nix
        working-directory: nix
        run: nix build --print-out-paths '.#default'
      - name: Load image into Docker
        working-directory: nix
        run: docker load --input result
      - name: Smoke test the image
        # Actually source init.lua: check that plugins loaded and startup didn't
        # log errors. `nvim --version` exits before loading the config.
        run: |
          docker run --rm dotfiles:latest nvim --headless \
            "+lua local m=vim.fn.execute('messages'); if #vim.pack.get() == 0 or m:find('Error') or m:find('E%d+:') then vim.cmd('cquit 1') end" \
            +q
      - name: Tag and push
        # NOTE: meta.outputs.tags is newline-separated, which cannot feed a
        # `for ... in` list (bash doesn't continue word lists across newlines),
        # so iterate lines instead.
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag dotfiles:latest "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
