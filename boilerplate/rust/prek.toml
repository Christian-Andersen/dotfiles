[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-format"
name = "cargo-format"
language = "system"
pass_filenames = false
entry = "cargo fmt --all -- --check"

[[repos.hooks]]
id = "cargo-check"
name = "cargo-check"
language = "system"
pass_filenames = false
entry = "cargo clippy --all-targets --all-features -- -D warnings"

[[repos.hooks]]
id = "cargo-build"
name = "cargo-build"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "cargo build --release --all-targets --all-features"

[[repos.hooks]]
id = "audit"
name = "audit"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "cargo audit"

[[repos.hooks]]
id = "test"
name = "test"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "cargo test --all-targets --all-features"
