[[repos]]
repo = "local"

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
pass_filenames = false
entry = "golangci-lint run --fix ./..."

[[repos.hooks]]
id = "go-build"
name = "go build"
language = "system"
pass_filenames = false
entry = "go build ./..."

[[repos.hooks]]
id = "audit"
name = "audit"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "govulncheck ./..."

[[repos.hooks]]
id = "test"
name = "test"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "go test ./..."
