[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "mixed-line-ending" },
  { id = "check-yaml" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-symlinks" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
  { id = "fix-byte-order-marker" },
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
language = "system"
pass_filenames = false
entry = "pnx --no-install oxlint --fix --deny-warnings src/"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
language = "system"
pass_filenames = false
entry = "pnx --no-install oxfmt src/"

[[repos.hooks]]
id = "tsc"
name = "tsc"
language = "system"
pass_filenames = false
entry = "pnx --no-install tsc --noEmit"

[[repos.hooks]]
id = "build"
name = "build"
language = "system"
pass_filenames = false
always_run = true
groups = ["slow"]
entry = "npm run build"

[[repos.hooks]]
id = "audit"
name = "audit"
language = "system"
pass_filenames = false
always_run = true
groups = ["slow"]
entry = "npm audit"

[[repos.hooks]]
id = "test"
name = "test"
language = "system"
pass_filenames = false
always_run = true
groups = ["slow"]
entry = "npm test"
