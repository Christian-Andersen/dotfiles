[[repos]]
repo = "local"

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
language = "system"
pass_filenames = false
entry = "pnx --no-install oxlint --fix --deny-warnings src/"

[[repos.hooks]]
id = "oxfmt"
name = "oxfmt"
language = "system"
pass_filenames = false
entry = "pnx --no-install oxfmt src/"

[[repos.hooks]]
id = "tsc"
name = "tsc"
language = "system"
pass_filenames = false
entry = "pnx --no-install tsc --noEmit"

[[repos.hooks]]
id = "build"
name = "build"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "npm run build"

[[repos.hooks]]
id = "audit"
name = "audit"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "npm audit"

[[repos.hooks]]
id = "test"
name = "test"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "npm test"
