[[repos]]
repo = "local"

[[repos.hooks]]
id = "zig-format"
name = "zig-format"
language = "system"
pass_filenames = false
entry = "zig fmt ."

[[repos.hooks]]
id = "zig-check"
name = "zig-check"
language = "system"
pass_filenames = false
entry = "zig build check"

[[repos.hooks]]
id = "zig-build"
name = "zig-build"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "zig build -Doptimize=ReleaseFast"

[[repos.hooks]]
id = "test"
name = "test"
language = "system"
pass_filenames = false
groups = ["slow"]
entry = "zig build test"
